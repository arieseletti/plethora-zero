name: PLETHORA Daily SEO & GEO Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # Runs automatically every day at 13:00 UTC (8 AM EST)

permissions:
  contents: write

jobs:
  publish-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PLETHORA SEO/GEO Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/plethora-engine.mjs

      - name: Commit and push new articles + sitemap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "PLETHORA Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-publish daily SEO/GEO articles & update sitemap" && git push)
